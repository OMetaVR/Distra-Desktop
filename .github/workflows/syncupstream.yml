# Fork-only workflow (see FORK.md). Merges upstream Equicord into main, but only
# after the merged result validates, then publishes a release for the in-client updater.
name: Sync with Upstream

on:
    schedule:
        - cron: "15 */3 * * *"
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    actions: write

concurrency:
    group: syncupstream-main
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository != 'Equicord/Equicord'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        outputs:
            promoted: ${{ steps.sync.outputs.promoted }}
            commit: ${{ steps.sync.outputs.commit }}
            release: ${{ steps.sync.outputs.release }}
        steps:
            # A personal token is needed to push upstream merges that touch .github/workflows.
            - uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0
                  token: ${{ secrets.PAT_TOKEN || github.token }}

            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Merge, validate and promote
              id: sync
              env:
                  GH_TOKEN: ${{ github.token }}
                  PUSHED_WITH_PAT: ${{ secrets.PAT_TOKEN != '' }}
              run: bash .fork/sync.sh

    release:
        needs: sync
        if: needs.sync.outputs.promoted == 'true' && needs.sync.outputs.release == 'true'
        uses: ./.github/workflows/build.yml
        with:
            ref: ${{ needs.sync.outputs.commit }}
